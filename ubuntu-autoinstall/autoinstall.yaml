#cloud-config
autoinstall:
  version: 1
  locale: en_US.UTF-8
  keyboard: {layout: br, variant: abnt2}
  source: {id: ubuntu-desktop, search_drivers: true}
  storage: {layout: {name: direct}}
  identity:
    realname: Vinicius
    username: vinicius
    hostname: vinicius-ubuntu
    password: DEFINA_A_SENHA_NA_TELA_DO_INSTALADOR
  ssh: {install-server: true, allow-pw: true}
  codecs: {install: true}
  drivers: {install: true}
  timezone: Europe/Lisbon
  updates: security
  packages:
    - curl
    - ca-certificates
    - git
    - openssh-server
    - python3-full
    - flatpak
    - build-essential
    - dkms
    - linux-headers-generic
  interactive-sections: [network, storage, identity]
  user-data:
    write_files:
      - path: /usr/local/sbin/vinicius-bootstrap
        permissions: '0755'
        content: |
          #!/usr/bin/env bash
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          U=vinicius
          H=$(getent passwd "$U" | cut -d: -f6)
          log(){ echo "[$(date -Is)] $*" | tee -a /var/log/vinicius-bootstrap.log; }
          retry(){ for i in 1 2 3 4; do "$@" && return; sleep 15; done; return 1; }
          exec > >(tee -a /var/log/vinicius-bootstrap.log) 2>&1
          getent hosts archive.ubuntu.com >/dev/null
          retry apt-get update
          add-apt-repository -y universe || true
          retry apt-get update
          apt-get install -y software-properties-common curl wget ca-certificates gnupg git \
            build-essential cmake ninja-build pkg-config dkms linux-headers-generic linux-firmware mokutil \
            python3-full python3-pip python3-venv pipx flatpak gnome-software-plugin-flatpak \
            openssh-server ufw fail2ban net-tools iproute2 dnsutils traceroute mtr-tiny nmap tcpdump \
            ethtool iperf3 socat jq ripgrep fzf htop btop tree tmux unzip zip p7zip-full rsync rclone \
            vim nano shellcheck lsof strace usbutils pciutils lshw smartmontools nvme-cli lm-sensors \
            bluez blueman libinput-tools evtest wl-clipboard xclip dconf-cli gnome-tweaks \
            language-pack-en language-pack-gnome-en language-pack-ja language-pack-gnome-ja \
            language-pack-pt language-pack-gnome-pt ibus-mozc mozc-data mozc-server logiops \
            gnome-shell-extension-dashtodock gnome-shell-extension-desktop-icons-ng \
            gnome-shell-extension-tiling-assistant gnome-shell-extension-appindicator wireguard-tools
          install -d -m0755 /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          cat >/etc/apt/sources.list.d/docker.sources <<EOF
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: noble
          Components: stable
          Architectures: amd64
          Signed-By: /etc/apt/keyrings/docker.asc
          EOF
          curl -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
          curl -fsSLo /etc/apt/sources.list.d/brave-browser-release.sources https://brave-browser-apt-release.s3.brave.com/brave-browser.sources
          curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor -o /usr/share/keyrings/microsoft.gpg
          cat >/etc/apt/sources.list.d/vscode.sources <<EOF
          Types: deb
          URIs: https://packages.microsoft.com/repos/code
          Suites: stable
          Components: main
          Architectures: amd64
          Signed-By: /usr/share/keyrings/microsoft.gpg
          EOF
          retry apt-get update
          apt-get install -y brave-browser code docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          systemctl enable --now docker containerd ssh fail2ban bluetooth
          usermod -aG docker "$U"
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get install -y nodejs
          npm install -g pnpm
          flatpak remote-add --system --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --system -y flathub org.telegram.desktop com.discordapp.Discord com.mattjakeman.ExtensionManager || true
          ufw default deny incoming
          ufw default allow outgoing
          ufw allow OpenSSH
          ufw --force enable
          cat >/etc/logid.cfg <<'EOF'
          devices: (
            { name: "Wireless Mouse MX Master 3"; smartshift: { on: true; threshold: 10; torque: 50; }; hiresscroll: { hires: true; invert: false; target: false; }; dpi: 1000;
              buttons: (
                { cid: 0xc3; action = { type: "Gestures"; gestures: (
                  { direction: "Up"; mode: "OnRelease"; action = { type: "Keypress"; keys: ["KEY_LEFTMETA"]; }; },
                  { direction: "Down"; mode: "OnRelease"; action = { type: "Keypress"; keys: ["KEY_LEFTMETA"]; }; },
                  { direction: "Left"; mode: "OnRelease"; action = { type: "Keypress"; keys: ["KEY_LEFTMETA", "KEY_PAGEUP"]; }; },
                  { direction: "Right"; mode: "OnRelease"; action = { type: "Keypress"; keys: ["KEY_LEFTMETA", "KEY_PAGEDOWN"]; }; }
                ); }; },
                { cid: 0x53; action = { type: "Keypress"; keys: ["KEY_LEFTALT", "KEY_LEFT"]; }; },
                { cid: 0x56; action = { type: "ToggleSmartshift"; }; },
                { cid: 0x52; action = { type: "Keypress"; keys: ["KEY_PLAYPAUSE"]; }; },
                { cid: 0xc4; action = { type: "Keypress"; keys: ["KEY_LEFTALT", "KEY_TAB"]; }; }
              );
            }
          );
          EOF
          systemctl enable --now logid || true
          if lsusb -d 2c4e:0115 >/dev/null 2>&1; then
            rm -rf /opt/ma530
            git clone --depth=1 https://github.com/vcanonici/Mercusys-MA530-Ubuntu-Driver.git /opt/ma530
            cd /opt/ma530
            MA530_USE_DKMS=1 ./scripts/agent_install.sh || true
          fi
          install -d -o "$U" -g "$U" "$H/.config/autostart" "$H/.local/bin"
          cat >"$H/.local/bin/apply-vinicius-gnome" <<'EOF'
          #!/usr/bin/env bash
          gsettings set org.gnome.shell.keybindings show-screenshot-ui "['<Ctrl><Shift>s']"
          gsettings set org.gnome.mutter check-alive-timeout 30000
          gsettings set org.gnome.desktop.peripherals.touchpad tap-to-click false
          gsettings set org.gnome.desktop.peripherals.touchpad natural-scroll true
          gsettings set org.gnome.desktop.peripherals.touchpad speed 0.28125
          gsettings set org.gnome.desktop.peripherals.touchpad click-method areas
          gsettings set org.gnome.desktop.peripherals.mouse accel-profile adaptive
          gsettings set org.gnome.desktop.peripherals.mouse speed 0.6
          gsettings set org.gnome.shell disable-user-extensions false
          gsettings set org.gnome.shell enabled-extensions "['dash-to-dock@micxgx.gmail.com','ding@rastersoft.com','tiling-assistant@ubuntu.com','ubuntu-appindicators@ubuntu.com']"
          gsettings set org.gnome.shell.extensions.dash-to-dock dock-position BOTTOM
          gsettings set org.gnome.shell.extensions.dash-to-dock extend-height false
          gsettings set org.gnome.shell.extensions.dash-to-dock dock-fixed true
          gsettings set org.gnome.shell.extensions.dash-to-dock dash-max-icon-size 48
          gsettings set org.gnome.desktop.input-sources sources "[('xkb','br'),('xkb','us'),('ibus','mozc-jp'),('xkb','jp'),('xkb','pt')]"
          rm -f "$HOME/.config/autostart/vinicius-gnome.desktop"
          EOF
          chmod +x "$H/.local/bin/apply-vinicius-gnome"
          cat >"$H/.config/autostart/vinicius-gnome.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=Aplicar configuração Vinicius
          Exec=$H/.local/bin/apply-vinicius-gnome
          X-GNOME-Autostart-enabled=true
          EOF
          chown -R "$U:$U" "$H/.config" "$H/.local"
          touch /var/lib/vinicius-bootstrap.done
          log "Concluído"
      - path: /etc/systemd/system/vinicius-bootstrap.service
        permissions: '0644'
        content: |
          [Unit]
          Description=Provisionamento da workstation Vinicius
          Wants=network-online.target
          After=network-online.target
          ConditionPathExists=!/var/lib/vinicius-bootstrap.done
          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/vinicius-bootstrap
          Restart=on-failure
          RestartSec=30
          [Install]
          WantedBy=multi-user.target
    runcmd:
      - [systemctl, daemon-reload]
      - [systemctl, enable, --now, vinicius-bootstrap.service]
    final_message: Provisionamento iniciado. Veja /var/log/vinicius-bootstrap.log
  shutdown: reboot
